<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/fav_icon.png" />
    <title>The Shrinking Notepad</title>
    <script src="/analytics.js" defer></script>
    <style>
      :root {
        --page: #f7f1e6;
        --paper: #fffaf0;
        --paper-line: rgba(118, 92, 56, 0.13);
        --ink: #30271f;
        --muted-ink: #766a5f;
        --sidebar: #efe4d0;
        --sidebar-border: #d8c5a6;
        --accent: #8e5f2f;
        --accent-hover: #744b22;
        --shadow: rgba(67, 47, 24, 0.16);
        --focus-ring: rgba(142, 95, 47, 0.28);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #17130f;
          --paper: #211b15;
          --paper-line: rgba(230, 205, 166, 0.09);
          --ink: #f0e4d2;
          --muted-ink: #b8a996;
          --sidebar: #261f17;
          --sidebar-border: #4b3d2e;
          --accent: #d39a5b;
          --accent-hover: #e2ae73;
          --shadow: rgba(0, 0, 0, 0.32);
          --focus-ring: rgba(211, 154, 91, 0.24);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at top left, rgba(255, 255, 255, 0.38), transparent 34rem),
          var(--page);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      button,
      textarea {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .app-shell {
        display: flex;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 50;
        display: flex;
        width: min(20rem, 86vw);
        flex-direction: column;
        padding: 1.25rem;
        background: var(--sidebar);
        border-right: 1px solid var(--sidebar-border);
        box-shadow: 1rem 0 2rem var(--shadow);
        transition: transform 0.3s ease-in-out;
      }

      .sidebar.closed {
        transform: translateX(-100%);
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .sidebar-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .icon-button,
      .primary-button {
        border: 0;
        cursor: pointer;
        transition:
          background-color 0.18s ease,
          color 0.18s ease,
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }

      .icon-button {
        display: inline-flex;
        width: 2.5rem;
        height: 2.5rem;
        align-items: center;
        justify-content: center;
        padding: 0;
        border-radius: 999px;
        background: transparent;
      }

      .icon-button:hover {
        background: rgba(118, 92, 56, 0.14);
      }

      .icon-button:focus-visible,
      .primary-button:focus-visible,
      #editor:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      .primary-button {
        width: 100%;
        margin-bottom: 1rem;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fffaf0;
        font-weight: 700;
        letter-spacing: 0.01em;
        box-shadow: 0 0.35rem 0.9rem var(--shadow);
      }

      .primary-button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      #historyList {
        flex: 1;
        overflow-y: auto;
      }

      .history-item {
        position: relative;
        margin-bottom: 0.35rem;
        padding: 0.75rem 0.9rem 0.75rem 1rem;
        overflow: hidden;
        border-radius: 0.35rem;
        color: var(--muted-ink);
        cursor: pointer;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition:
          background-color 0.18s ease,
          color 0.18s ease;
      }

      .history-item:hover {
        background: rgba(118, 92, 56, 0.12);
        color: var(--ink);
      }

      .history-item.active {
        background: rgba(142, 95, 47, 0.14);
        color: var(--ink);
        font-weight: 700;
      }

      .history-item.active::before {
        position: absolute;
        top: 0.55rem;
        bottom: 0.55rem;
        left: 0.35rem;
        width: 3px;
        border-radius: 999px;
        background: var(--accent);
        content: '';
      }

      .main-content {
        position: relative;
        display: flex;
        flex: 1;
        width: 100%;
        height: 100%;
        flex-direction: column;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(19, 14, 9, 0.44);
      }

      .hidden {
        display: none;
      }

      .controls {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 10;
      }

      .controls .icon-button {
        background: color-mix(in srgb, var(--paper) 82%, transparent);
        box-shadow: 0 0.35rem 1rem var(--shadow);
        backdrop-filter: blur(8px);
      }

      .editor-wrap {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding: clamp(1rem, 5vw, 3rem);
        overflow: hidden;
      }

      #editor {
        display: flex;
        width: min(100%, 68rem);
        height: min(100%, 44rem);
        align-items: center;
        justify-content: center;
        padding: clamp(1.5rem, 5vw, 4rem);
        resize: none;
        border: 1px solid var(--sidebar-border);
        border-radius: 1.25rem;
        outline: none;
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 2.2rem,
            var(--paper-line) 2.2rem,
            var(--paper-line) calc(2.2rem + 1px)
          ),
          var(--paper);
        box-shadow: 0 1.25rem 3rem var(--shadow);
        color: var(--ink);
        line-height: 1.2;
        text-align: center;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          font-size 0.1s ease-out;
      }

      #editor::placeholder {
        color: var(--muted-ink);
        opacity: 0.72;
      }

      #editor:focus {
        border-color: var(--accent);
        box-shadow:
          0 1.25rem 3rem var(--shadow),
          0 0 0 0.35rem var(--focus-ring);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @media (max-width: 48rem) {
        .editor-wrap {
          padding: 4.5rem 1rem 1rem;
        }

        #editor {
          border-radius: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar closed">
        <div class="sidebar-header">
          <h2 class="sidebar-title">History</h2>
          <button onclick="toggleSidebar()" class="icon-button" aria-label="Close history">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
        </div>

        <button onclick="newNote()" class="primary-button">+ New Note</button>

        <div id="historyList" class="no-scrollbar">
          <!-- History items injected here -->
        </div>
      </aside>

      <main class="main-content">
        <div id="overlay" onclick="toggleSidebar()" class="overlay hidden"></div>

        <div class="controls">
          <button onclick="toggleSidebar()" class="icon-button" aria-label="Open history">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="editor-wrap">
          <textarea
            id="editor"
            placeholder="Start typing..."
            spellcheck="false"
            autocomplete="off"
          ></textarea>
        </div>
      </main>
    </div>

    <script>
      const editor = document.getElementById('editor')
      const sidebar = document.getElementById('sidebar')
      const overlay = document.getElementById('overlay')
      const historyList = document.getElementById('historyList')

      let currentNoteId = null
      let notes = JSON.parse(localStorage.getItem('shrink_notes') || '[]')

      window.onload = () => {
        loadLatestNote()
        editor.focus()
        updateHistoryUI()
        adjustFontSize()
      }

      const resizeObserver = new ResizeObserver(() => {
        adjustFontSize()
      })
      resizeObserver.observe(editor)

      editor.addEventListener('input', () => {
        adjustFontSize()
        saveCurrentNote()
      })

      function adjustFontSize() {
        const text = editor.value
        const containerWidth = editor.clientWidth - 40
        const containerHeight = editor.clientHeight - 40

        let fontSize = 120
        const minSize = 16

        const tester = document.createElement('span')
        tester.style.visibility = 'hidden'
        tester.style.position = 'absolute'
        tester.style.whiteSpace = 'pre-wrap'
        tester.style.lineHeight = '1.2'
        tester.style.width = containerWidth + 'px'
        tester.innerText = text || editor.placeholder
        document.body.appendChild(tester)

        while (fontSize > minSize) {
          tester.style.fontSize = fontSize + 'px'
          if (tester.offsetHeight <= containerHeight) {
            break
          }
          fontSize -= 2
        }

        document.body.removeChild(tester)
        editor.style.fontSize = fontSize + 'px'
      }

      function saveCurrentNote() {
        const content = editor.value.trim()
        if (!content) return

        const timestamp = new Date().getTime()

        if (!currentNoteId) {
          currentNoteId = 'note_' + timestamp
          notes.unshift({
            id: currentNoteId,
            text: content,
            updated: timestamp,
          })
        } else {
          const index = notes.findIndex((n) => n.id === currentNoteId)
          if (index !== -1) {
            notes[index].text = content
            notes[index].updated = timestamp
            const note = notes.splice(index, 1)[0]
            notes.unshift(note)
          }
        }

        if (notes.length > 50) notes.pop()

        localStorage.setItem('shrink_notes', JSON.stringify(notes))
        updateHistoryUI()
      }

      function updateHistoryUI() {
        historyList.innerHTML = ''
        notes.forEach((note) => {
          const item = document.createElement('div')
          item.className = 'history-item ' + (note.id === currentNoteId ? 'active' : '')
          item.innerText = note.text.substring(0, 50) || '(Empty Note)'
          item.onclick = () => loadNote(note.id)
          historyList.appendChild(item)
        })
      }

      function loadNote(id) {
        const note = notes.find((n) => n.id === id)
        if (note) {
          currentNoteId = note.id
          editor.value = note.text
          adjustFontSize()
          updateHistoryUI()
          if (window.innerWidth < 768) toggleSidebar()
        }
      }

      function loadLatestNote() {
        if (notes.length > 0) {
          loadNote(notes[0].id)
        } else {
          newNote()
        }
      }

      function newNote() {
        currentNoteId = null
        editor.value = ''
        adjustFontSize()
        updateHistoryUI()
        editor.focus()
        if (window.innerWidth < 768 && !sidebar.classList.contains('closed')) toggleSidebar()
      }

      function toggleSidebar() {
        sidebar.classList.toggle('closed')
        overlay.classList.toggle('hidden')
      }

      editor.onkeydown = function (e) {
        if (e.keyCode === 9) {
          e.preventDefault()
          const start = this.selectionStart
          const end = this.selectionEnd
          this.value = this.value.substring(0, start) + '\t' + this.value.substring(end)
          this.selectionStart = this.selectionEnd = start + 1
        }
      }
    </script>
  </body>
</html>
